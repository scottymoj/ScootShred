<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shred 8">

<title>Scoot Shred 8-Bit</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
  html, body { margin: 0; height: 100%; background: #0e1424; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>
<script type="module" src="js/main.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
